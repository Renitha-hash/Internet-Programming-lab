<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body style="margin:0;
             padding:0;
             font-family:Arial, sans-serif;
             background-image:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuv08kUFWODRN662YidqZqjUbZWADhcX9W_luuaNcoRw&s=10');
             background-size:cover;
             background-repeat:no-repeat;">

<center>

<br><br>

<h1 style="color:darkblue;
           text-shadow:3px 3px 5px gray;
           font-size:40px;">
User Login
</h1>

<hr width="80%">

<a href="index.html"
style="color:blue;
       font-size:20px;
       font-weight:bold;
       margin-right:20px;">
Home
</a>

<a href="register.html"
style="color:blue;
       font-size:20px;
       font-weight:bold;">
Register
</a>

<hr width="80%">

<form
style="background:white;
       width:400px;
       border:4px solid darkblue;
       padding:25px;
       margin-top:30px;
       border-radius:15px;
       box-shadow:5px 5px 15px gray;">

<h2 style="color:darkblue;">Login Here</h2>

<label style="font-size:18px;"><b>Username</b></label>

<br><br>

<input type="text"
placeholder="Enter Username"

style="width:90%;
padding:10px;
border:2px solid gray;
border-radius:5px;">

<br><br>

<label style="font-size:18px;"><b>Password</b></label>

<br><br>

<input type="password"
placeholder="Enter Password"

style="width:90%;
padding:10px;
border:2px solid gray;
border-radius:5px;">

<br><br>

<label style="font-size:18px;">

<input type="checkbox">

Remember Me

</label>

<br><br>

<input
type="submit"
value="Login"

style="background:green;
color:white;
padding:12px 30px;
border:none;
border-radius:5px;
font-size:18px;
cursor:pointer;">



</form>

<br>

<p style="font-size:18px;">

New User?

<a href="register.html"

style="text-decoration:none;
color:red;
font-weight:bold;">

Register Here

</a>

</p>



</center>

</body>

</html>
