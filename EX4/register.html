
<!DOCTYPE html> 

<html lang="en"> 

<head> 

  <title>Job Seeker Registration</title> 

  <style> 

    body { 

      font-family: Arial, sans-serif; 

      background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 

                  url("https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1500&q=80") center/cover fixed; 

      display: flex; 

      justify-content: center; 

      align-items: center; 

      min-height: 100vh; 

      margin: 0; 

    } 

    .box { 

      background: #fff; 

      padding: 25px; 

      width: 420px; 

      border-radius: 10px; 

      box-shadow: 0 0 10px rgba(0, 0, 0, 0.333); 

    } 

    h2 { 

      text-align: center; 

      color: #0d6efd; 

    } 

    label { 

      display: block; 

      margin-top: 10px; 

      font-weight: bold; 

    } 

    input { 

      width: 100%; 

      padding: 8px; 

      box-sizing: border-box; 

    } 

    button { 

      width: 100%; 

      padding: 10px; 

      margin-top: 18px; 

      background: #0d6efd; 

      color: #fff; 

      border: 0; 

      border-radius: 5px; 

      cursor: pointer; 

    } 

    .e { 

      color: red; 

      font-size: 12px; 

    } 

  </style> 

</head> 

<body> 

  <div class="box"> 

    <h2>Job Seeker Registration</h2> 

    <form id="f"> 

      <label for="fn">First Name</label> 

      <input id="fn"> 

      <div class="e" id="e1"></div> 

      <label for="ln">Last Name</label> 

      <input id="ln"> 

      <div class="e" id="e2"></div> 

      <label for="em">Email</label> 

      <input id="em"> 

      <div class="e" id="e3"></div> 

      <label for="ph">Phone</label> 

      <input id="ph"> 

      <div class="e" id="e4"></div> 

      <label for="pw">Password</label> 

      <input type="password" id="pw"> 

      <div class="e" id="e5"></div> 

      <label for="jt">Desired Job Title</label> 

      <input id="jt"> 

      <div class="e" id="e6"></div> 

      <label for="ex">Years of Experience</label> 

      <input type="number" id="ex"> 

      <div class="e" id="e7"></div> 

      <label for="li">LinkedIn</label> 

      <input id="li" placeholder="https://linkedin.com/in/..."> 

      <div class="e" id="e8"></div> 

      <label for="gh">GitHub</label> 

      <input id="gh" placeholder="https://github.com/..."> 

      <div class="e" id="e9"></div> 

      <label for="rf">Resume</label> 

      <input type="file" id="rf" accept=".pdf,.doc,.docx"> 

      <div class="e" id="e10"></div> 

      <button type="submit">Register</button> 

    </form> 

  </div> 

  <script> 

    const form = document.getElementById("f"); 

    form.onsubmit = function (e) { 

      e.preventDefault(); 

      // Clear existing error messages 

      document.querySelectorAll(".e").forEach((el) => (el.textContent = "")); 

      let ok = true; 

      const requireField = (id, errorId, message) => { 

        if (!document.getElementById(id).value.trim()) { 

          document.getElementById(errorId).textContent = message; 

          ok = false; 

        } 

      }; 

      // Required text fields 

      requireField("fn", "e1", "First name required"); 

      requireField("ln", "e2", "Last name required"); 

      requireField("jt", "e6", "Job title required"); 

      // Specific validation checks 

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById("em").value)) { 

        document.getElementById("e3").textContent = "Valid email required"; 

        ok = false; 

      } 

      if (!/^\d{10}$/.test(document.getElementById("ph").value)) { 

        document.getElementById("e4").textContent = "10-digit phone required"; 

        ok = false; 

      } 

      if (document.getElementById("pw").value.length < 6) { 

        document.getElementById("e5").textContent = "Minimum 6 characters"; 

        ok = false; 

      } 

      const exVal = document.getElementById("ex").value; 

      if (exVal === "" || +exVal < 0) { 

        document.getElementById("e7").textContent = "Valid experience required"; 

        ok = false; 

      } 

      if (!/^https?:\/\//.test(document.getElementById("li").value)) { 

        document.getElementById("e8").textContent = "Valid LinkedIn URL required"; 

        ok = false; 

      } 

      if (!/^https?:\/\//.test(document.getElementById("gh").value)) { 

        document.getElementById("e9").textContent = "Valid GitHub URL required"; 

        ok = false; 

      } 

      const fileInput = document.getElementById("rf"); 

      if (fileInput.files.length === 0) { 

        document.getElementById("e10").textContent = "Upload resume"; 

        ok = false; 

      } else if (!/\.(pdf|doc|docx)$/i.test(fileInput.files[0].name)) { 

        document.getElementById("e10").textContent = "PDF/DOC/DOCX only"; 

        ok = false; 

      } 

      if (ok) { 

        alert("Registration Successful!"); 

        form.reset(); 

      } 

    }; 

  </script> 

</body> 

</html>
