<title>Fashion Hub - Register</title>
</head>

<body bgcolor="mistyrose">

<div align="center"
style="
background:white;
width:60%;
padding:30px;
margin:auto;
border:5px dotted deeppink;
border-radius:25px;
box-shadow:0px 0px 15px hotpink;">

<img src="https://th.bing.com/th/id/OIP.JGgPgExgWdqd9rrdyQ0xCQHaE8?w=282&h=188&c=7&r=0&o=7&pid=1.7&rm=3" width="160" height="160" style="border-radius:15px;">

<h1 style="color:#8E44AD;font-size:45px;">FASHION HUB</h1>

<h2 style="color:brown;">Customer Registration</h2>

<p>Create your account to enjoy a better shopping experience.</p>

<form>

<table border="1"
style="
background:#FFF0F5;
border-collapse:collapse;
border:3px solid #8E44AD;">
<tr>
<td><b>Full Name</b></td>
<td><input type="text" placeholder="Enter Full Name" required></td>
</tr>

<tr>
<td><b>Email ID</b></td>
<td><input type="email" placeholder="Enter Email Address" required></td>
</tr>

<tr>
<td><b>Password</b></td>
<td><input type="password" placeholder="Create Password" required></td>
</tr>

<tr>
<td><b>Mobile Number</b></td>
<td><input type="tel" placeholder="Enter Mobile Number"></td>
</tr>

<tr>
<td><b>Gender</b></td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
</td>
</tr>

<tr>
<td><b>Date of Birth</b></td>
<td>
<input type="date">
</td>
</tr>

<tr>
<td><b>Address</b></td>
<td>
<textarea rows="4" cols="25" placeholder="Enter Address"></textarea>
</td>
</tr>

<tr>
<td><b>Favourite Category</b></td>
<td>
<select>
<option>Kurti</option>
<option>Accessories</option>
<option>Footwear</option>
<option>Handbags</option>
</select>
</td>
</tr>

<tr>
<td colspan="2" align="center">

<input type="submit"
style="
background:#E91E63;
color:white;
padding:10px 25px;
border-radius:20px;
border:none;">
<input type="reset" value="Clear">

</td>
</tr>

</table>

</form>
