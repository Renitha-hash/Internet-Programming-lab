<!DOCTYPE html>
<html>
<head>
    <title>Online Snacks Shopping</title>
    <style>
        body { font-family: Arial; background-color: #fff8f0; margin: 0; }
        header { background-color: #ff6b35; color: white; text-align: center; padding: 25px; }
        .container { width: 90%; margin: 30px auto; }
        button { background-color: #ff6b35; color: white; border: none;
                 padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: white; }
        th { background-color: #ff6b35; color: white; padding: 12px; }
        td { padding: 12px; text-align: center; border: 1px solid #ddd; }
        tr:nth-child(even) { background-color: #fff1e8; }
        .cart { background-color: white; margin-top: 30px; padding: 20px; text-align: center; }
        .error { color: red; text-align: center; font-weight: bold; }
        footer { margin-top: 40px; padding: 20px; background-color: #333;
                 color: white; text-align: center; }
    </style>

    <script>
        function loadSnacks() {
            var xhttp = new XMLHttpRequest();

            xhttp.onreadystatechange = function() {
                if (this.readyState == 4) {
                    if (this.status == 200) {
                        var xml = this.responseXML;

                        if (!xml) {
                            document.getElementById("orderData").innerHTML =
                                "<p class='error'>Unable to read XML file.</p>";
                            return;
                        }

                        var orders = xml.getElementsByTagName("order");
                        var output = "<table>";

                        output += "<tr>";
                        output += "<th>ID</th>";
                        output += "<th>Customer</th>";
                        output += "<th>Snack</th>";
                        output += "<th>Quantity</th>";
                        output += "<th>Price</th>";
                        output += "<th>Total</th>";
                        output += "<th>Action</th>";
                        output += "</tr>";

                        for (var i = 0; i < orders.length; i++) {
                            var id = orders[i].getElementsByTagName("id")[0].textContent;
                            var customer = orders[i].getElementsByTagName("customer")[0].textContent;
                            var snack = orders[i].getElementsByTagName("snack")[0].textContent;
                            var quantity = parseInt(
                                orders[i].getElementsByTagName("quantity")[0].textContent
                            );
                            var price = parseFloat(
                                orders[i].getElementsByTagName("price")[0].textContent
                            );
                            var total = quantity * price;

                            output += "<tr>";
                            output += "<td>" + id + "</td>";
                            output += "<td>" + customer + "</td>";
                            output += "<td>" + snack + "</td>";
                            output += "<td>" + quantity + "</td>";
                            output += "<td>₹" + price.toFixed(2) + "</td>";
                            output += "<td>₹" + total.toFixed(2) + "</td>";
                            output += "<td><button onclick='addToCart(" + total + ")'>";
                            output += "Add to Cart</button></td>";
                            output += "</tr>";
                        }

                        output += "</table>";
                        document.getElementById("orderData").innerHTML = output;
                    } else {
                        document.getElementById("orderData").innerHTML =
                            "<p class='error'>Error loading orders.xml</p>";
                    }
                }
            };

            xhttp.open("GET", "orders.xml", true);
            xhttp.send();
        }

        function addToCart(amount) {
            var cartTotal =
                parseFloat(document.getElementById("cartTotal").textContent);

            cartTotal = cartTotal + amount;
            document.getElementById("cartTotal").textContent =
                cartTotal.toFixed(2);

            alert("Snack added to cart!");
        }

        function placeOrder() {
            var total = document.getElementById("cartTotal").textContent;

            if (parseFloat(total) == 0) {
                alert("Please add snacks to cart.");
            } else {
                alert("Order placed successfully!\nTotal Amount: ₹" + total);
            }
        }
    </script>
</head>

<body>
    <header>
        <h1>Online Snacks Shopping</h1>
        <p>Delicious snacks delivered to your doorstep!</p>
    </header>

    <div class="container">
        <h2>Available Snacks</h2>

        <button onclick="loadSnacks()">Load Snacks</button>

        <div id="orderData">
            <p style="text-align:center;">
                Click <b>Load Snacks</b> to view available snacks.
            </p>
        </div>

        <div class="cart">
            <h2>Shopping Cart</h2>
            <p>Total Amount: ₹<span id="cartTotal">0.00</span></p>
            <button onclick="placeOrder()">Place Order</button>
        </div>
    </div>

    <footer>
        © 2026 Online Snacks Shopping | Fresh & Tasty Snacks
    </footer>
</body>
</html>
